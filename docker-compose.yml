services:
  mocke:
    build: .
    image: mocke:latest
    container_name: mocke
    restart: unless-stopped
    ports:
      # Só localhost: use nginx/Caddy na frente. Para expor direto: "3000:3000"
      - "127.0.0.1:3000:3000"
    environment:
      PORT: ${PORT:-3000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - mocke-cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const p=process.env.PORT||'3000'; const r=await fetch('http://127.0.0.1:'+p+'/ready'); if(!r.ok) process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  mocke-cache:
